<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#3f9bec"/>

  <g clip-path="url(#r)">
    <!-- grass hill -->
    <path d="M0 34 Q 22 27 64 32 L 64 64 L 0 64 Z" fill="#71c552"/>

    <!-- road -->
    <path d="M-4 64 L -2 48 Q 26 33 68 37 L 68 64 Z" fill="#71777f"/>
    <rect x="12" y="43.5" width="9" height="3.4" rx="1.4" fill="#fbfcf9" transform="rotate(-20 12 43.5)"/>
    <rect x="40" y="36.6" width="9" height="3.4" rx="1.4" fill="#fbfcf9" transform="rotate(-5 40 36.6)"/>

    <!-- billboard 3: farthest, smallest -->
    <rect x="46.4" y="18" width="2" height="7" fill="#8e6b4a"/>
    <rect x="40" y="11" width="13" height="8.4" rx="1.3" fill="#fbf9f3"/>
    <rect x="41.2" y="12.2" width="10.6" height="6" rx="0.8" fill="#3aa6a6"/>

    <!-- billboard 2: middle -->
    <rect x="32.4" y="16" width="2.2" height="10" fill="#8e6b4a"/>
    <rect x="23" y="6" width="17" height="10.6" rx="1.6" fill="#fbf9f3"/>
    <rect x="24.4" y="7.4" width="14.2" height="7.8" rx="1" fill="#f2b632"/>

    <!-- billboard 1: foreground, biggest -->
    <rect x="10" y="27" width="3" height="15" fill="#75543a"/>
    <rect x="-2" y="12" width="24" height="15" rx="2" fill="#fbf9f3"/>
    <rect x="-0.6" y="13.4" width="21.2" height="12.2" rx="1.4" fill="#e4572e"/>
  </g>
</svg>
