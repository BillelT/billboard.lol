<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="r">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#3f9bec"/>

  <g clip-path="url(#r)">
    <!-- ground: straight horizon, more ground than sky, rising to the right -->
    <polygon points="0,28 64,12 64,64 0,64" fill="#71c552"/>

    <!-- road: straight-edged, recedes toward the horizon near the back billboard -->
    <polygon points="42,12 50,12 34,64 -8,64" fill="#71777f"/>
    <rect x="4.5" y="52" width="10" height="4" rx="1.6" fill="#fbfcf9" transform="rotate(-64 4.5 52)"/>
    <rect x="20" y="30" width="6" height="2.6" rx="1" fill="#fbfcf9" transform="rotate(-64 20 30)"/>

    <!-- billboard 3: farthest, smallest, planted at the horizon -->
    <rect x="48.6" y="17" width="1.8" height="9" fill="#8e6b4a"/>
    <rect x="44" y="3" width="11" height="7" rx="1.2" fill="#fbf9f3"/>
    <rect x="45" y="4" width="9" height="5" rx="0.7" fill="#3aa6a6"/>

    <!-- billboard 2: middle -->
    <rect x="36.9" y="14" width="2.2" height="13" fill="#8e6b4a"/>
    <rect x="30" y="4" width="16" height="10" rx="1.6" fill="#fbf9f3"/>
    <rect x="31.4" y="5.4" width="13.2" height="7.2" rx="1" fill="#f2b632"/>

    <!-- billboard 1: foreground, biggest, fully on-canvas, planted well into the grass -->
    <rect x="13.5" y="25" width="3" height="17" fill="#8e6b4a"/>
    <rect x="10" y="42" width="9" height="2.4" rx="1.2" fill="#5b432c"/>
    <rect x="3" y="10" width="24" height="15" rx="2" fill="#fbf9f3"/>
    <rect x="4.4" y="11.4" width="21.2" height="12.2" rx="1.4" fill="#e4572e"/>
  </g>
</svg>
